    // --- BEFORE & AFTER SLIDER (100% SHARP HD CLIP-PATH ENGINE) ---
    function BeforeAfterSlider({ onOpenEstimate }) {
      const [sliderPos, setSliderPos] = useState(50);
      const [activeScene, setActiveScene] = useState('living');
      const [isDragging, setIsDragging] = useState(false);
      const containerRef = useRef(null);

      const scenes = {
        living: {
          title: "Luxury Penthouse Living Room",
          before: "file:///C:/Users/purna/.gemini/antigravity-ide/brain/216693ac-90c2-4b79-b772-110597ebc05d/before_raw_apartment_1792741985796.jpg",
          after: "file:///C:/Users/purna/.gemini/antigravity-ide/brain/216693ac-90c2-4b79-b772-110597ebc05d/after_luxury_apartment_1792742145647.jpg",
          fallbackBefore: "https://images.unsplash.com/photo-1590381105924-c72589b9ef3f?auto=format&fit=crop&w=1920&q=85",
          fallbackAfter: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=85",
          beforeAlt: "Bare Shell Raw Concrete Apartment Living Room Before Work",
          afterAlt: "LS Interiors Finished Luxury Penthouse Living Room"
        },
        kitchen: {
          title: "German Finish Modular Kitchen",
          before: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1920&q=85",
          after: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?auto=format&fit=crop&w=1920&q=85",
          beforeAlt: "Unfinished Kitchen Shell Space Before Modular Installation",
          afterAlt: "LS Interiors High-Gloss Acrylic Modular Kitchen with Quartz Island"
        }
      };

      const current = scenes[activeScene];

      const updatePosition = (clientX) => {
        if (!containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const x = clientX - rect.left;
        const percentage = Math.min(Math.max((x / rect.width) * 100, 0), 100);
        setSliderPos(percentage);
      };

      const handlePointerDown = (e) => {
        setIsDragging(true);
        updatePosition(e.clientX || (e.touches && e.touches[0].clientX));
      };

      const handlePointerMove = (e) => {
        if (!isDragging) return;
        updatePosition(e.clientX || (e.touches && e.touches[0].clientX));
      };

      const handlePointerUp = () => setIsDragging(false);
      const handleClick = (e) => updatePosition(e.clientX);

      return (
        <section className="section slider-section" id="transformation">
          <div className="container">
            <div className="section-header">
              <span className="section-tag">High-Definition Visual Proof</span>
              <h2 className="section-title">The <span>LS Interiors</span> Transformation</h2>
              <p className="section-desc">
                Slide horizontally to experience the razor-sharp difference between a raw concrete flat and our Moosapet factory turnkey execution.
              </p>
            </div>

            {/* Scene Selector Tabs */}
            <div className="ba-scene-tabs">
              <button
                className={`tab-btn ${activeScene === 'living' ? 'active' : ''}`}
                onClick={() => setActiveScene('living')}
              >
                🛋️ Living Room Transformation
              </button>
              <button
                className={`tab-btn ${activeScene === 'kitchen' ? 'active' : ''}`}
                onClick={() => setActiveScene('kitchen')}
              >
                🍳 Modular Kitchen Transformation
              </button>
            </div>

            {/* Crystal-Clear Clip-Path Slider */}
            <div
              className="before-after-box"
              ref={containerRef}
              onClick={handleClick}
              onMouseDown={handlePointerDown}
              onMouseMove={handlePointerMove}
              onMouseUp={handlePointerUp}
              onMouseLeave={handlePointerUp}
              onTouchStart={handlePointerDown}
              onTouchMove={handlePointerMove}
              onTouchEnd={handlePointerUp}
            >
              <img
                src={current.before}
                alt={current.beforeAlt}
                className="ba-img-layer"
                onError={e => { if (current.fallbackBefore) e.target.src = current.fallbackBefore; }}
              />
              <span className="ba-label ba-label-before">Before: Raw Shell Flat</span>

              <div
                className="ba-after-layer"
                style={{
                  clipPath: `polygon(0% 0%, ${sliderPos}% 0%, ${sliderPos}% 100%, 0% 100%)`,
                  WebkitClipPath: `polygon(0% 0%, ${sliderPos}% 0%, ${sliderPos}% 100%, 0% 100%)`
                }}
              >
                <img
                  src={current.after}
                  alt={current.afterAlt}
                  className="ba-img-layer"
                  onError={e => { if (current.fallbackAfter) e.target.src = current.fallbackAfter; }}
                />
              </div>
              <span className="ba-label ba-label-after">After: LS Interiors Finished Home</span>

              <div className="ba-divider" style={{ left: `${sliderPos}%` }}>
                <div className="ba-handle">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/><polyline points="9 18 3 12 9 6"/></svg>
                </div>
              </div>
            </div>

            <div style={{ textAlign: 'center', marginTop: '2.5rem' }}>
              <button className="btn btn-gold" onClick={onOpenEstimate}>
                Transform Your Home • Get Free 3D Plan
              </button>
            </div>
          </div>
        </section>
      );
    }

    // --- COST CALCULATOR ---
    function CostCalculator({ onOpenEstimateWithData }) {
      const [propertyType, setPropertyType] = useState('3bhk');
      const [packageTier, setPackageTier] = useState('premium');
      const [selectedModules, setSelectedModules] = useState({
        kitchen: true,
        masterWardrobe: true,
        guestWardrobe: true,
        tvUnit: true,
        falseCeiling: true,
        painting: true,
        electrical: false
      });

      const propertyOptions = [
        { id: '1bhk', label: '1 BHK', area: '~650 sq.ft', multiplier: 0.6 },
        { id: '2bhk', label: '2 BHK', area: '~1,150 sq.ft', multiplier: 0.85 },
        { id: '3bhk', label: '3 BHK', area: '~1,650 sq.ft', multiplier: 1.0 },
        { id: '4bhk', label: '4 BHK / Villa', area: '~2,600+ sq.ft', multiplier: 1.55 },
        { id: 'office', label: 'Commercial Office', area: '~1,500 sq.ft', multiplier: 1.2 }
      ];

      const packageTiers = [
        { id: 'essential', title: 'Essential Smart', desc: 'MR Grade Plywood, 0.8mm Matte Laminates, Hafele/Ebco soft-close hinges. 5-Yr Warranty.', priceMultiplier: 0.82 },
        { id: 'premium', title: 'Premium Elegance', desc: '710 BWP Marine Ply, 1.5mm High-Gloss Acrylic, Hettich hardware & sensor LED. 10-Yr Warranty.', priceMultiplier: 1.0 },
        { id: 'royal', title: 'Royal Luxury Bespoke', desc: 'HDHMR & Marine Ply, PU Paint & Veneer accents, Blum hardware, Italian Quartz & Automation.', priceMultiplier: 1.38 }
      ];

      const modulesList = [
        { id: 'kitchen', label: 'Modular Kitchen & Pantry', basePrice: 185000 },
        { id: 'masterWardrobe', label: 'Master Bedroom Wardrobe & Dresser', basePrice: 140000 },
        { id: 'guestWardrobe', label: 'Guest / Kids Room Wardrobe', basePrice: 110000 },
        { id: 'tvUnit', label: 'Living TV Console & Fluted Panel', basePrice: 85000 },
        { id: 'falseCeiling', label: 'Gypsum False Ceiling & Cove Light', basePrice: 95000 },
        { id: 'painting', label: 'Royale Luxury Painting & Sanding', basePrice: 65000 },
        { id: 'electrical', label: 'Smart Electrical & Mood Lighting', basePrice: 70000 }
      ];

      const toggleModule = (id) => {
        setSelectedModules(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const calculatedCost = useMemo(() => {
        const propMultiplier = propertyOptions.find(p => p.id === propertyType)?.multiplier || 1.0;
        const tierMultiplier = packageTiers.find(t => t.id === packageTier)?.priceMultiplier || 1.0;

        let subtotal = 0;
        modulesList.forEach(mod => {
          if (selectedModules[mod.id]) subtotal += mod.basePrice;
        });

        const total = Math.round(subtotal * propMultiplier * tierMultiplier);
        return {
          total,
          woodwork: Math.round(total * 0.58),
          hardware: Math.round(total * 0.16),
          ceilingPainting: Math.round(total * 0.16),
          installation: Math.round(total * 0.1)
        };
      }, [propertyType, packageTier, selectedModules]);

      const formatINR = (val) => '₹ ' + (val / 100000).toFixed(2) + ' Lakhs';

      const handleBook = () => {
        const propLabel = propertyOptions.find(p => p.id === propertyType)?.label;
        const tierTitle = packageTiers.find(t => t.id === packageTier)?.title;
        onOpenEstimateWithData({
          propertyType: propLabel,
          packageTier: tierTitle,
          estimatedAmount: formatINR(calculatedCost.total),
          modulesCount: Object.values(selectedModules).filter(Boolean).length
        });
      };

      return (
        <section className="section calculator-section" id="calculator">
          <div className="container">
            <div className="section-header">
              <span className="section-tag">Instant Estimate Generator</span>
              <h2 className="section-title">Hyderabad Home <span>Interior Cost Estimator</span></h2>
              <p className="section-desc">
                Get an instant, transparent price projection based on your floor configuration and preferred materials. 
                Remember: At LS Interiors, we present the final 3D design and quotation with <strong>Zero Token Advance</strong>.
              </p>
            </div>

            <div className="calc-container">
              <div className="calc-steps">
                <div>
                  <div className="calc-group-title"><span>1</span> Select Home Configuration</div>
                  <div className="calc-options-grid">
                    {propertyOptions.map(opt => (
                      <button
                        key={opt.id}
                        type="button"
                        className={`calc-btn-option ${propertyType === opt.id ? 'selected' : ''}`}
                        onClick={() => setPropertyType(opt.id)}
                      >
                        <strong>{opt.label}</strong>
                        <div style={{ fontSize: '0.72rem', marginTop: '0.2rem', opacity: 0.8 }}>{opt.area}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <div className="calc-group-title"><span>2</span> Choose Finishing & Material Tier</div>
                  <div className="calc-tier-cards">
                    {packageTiers.map(tier => (
                      <div
                        key={tier.id}
                        className={`tier-card ${packageTier === tier.id ? 'selected' : ''}`}
                        onClick={() => setPackageTier(tier.id)}
                      >
                        <h5>{tier.title}</h5>
                        <p>{tier.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <div className="calc-group-title"><span>3</span> Select Scope & Rooms Required</div>
                  <div className="calc-checkboxes">
                    {modulesList.map(mod => (
                      <div
                        key={mod.id}
                        className={`calc-checkbox-item ${selectedModules[mod.id] ? 'checked' : ''}`}
                        onClick={() => toggleModule(mod.id)}
                      >
                        <input type="checkbox" checked={!!selectedModules[mod.id]} onChange={() => {}} />
                        <span>{mod.label}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="calc-summary-panel">
                <div>
                  <div className="summary-header">
                    <h4>Estimated Investment</h4>
                    <p style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>Factory Direct Pricing • Zero Middleman Commissions</p>
                  </div>

                  <div className="summary-price-box">
                    <div className="price-box-label">Projected Total (Turnkey)</div>
                    <div className="price-box-amount">{formatINR(calculatedCost.total)}</div>
                    <div className="price-box-note">*Final estimation confirmed after free laser site measurement</div>
                  </div>

                  <div className="summary-breakdown">
                    <div className="breakdown-row">
                      <span>In-House Factory Woodwork (Moosapet)</span>
                      <span>{formatINR(calculatedCost.woodwork)}</span>
                    </div>
                    <div className="breakdown-row">
                      <span>Fittings & Hardware (Hettich / Hafele)</span>
                      <span>{formatINR(calculatedCost.hardware)}</span>
                    </div>
                    <div className="breakdown-row">
                      <span>False Ceiling & Royale Painting</span>
                      <span>{formatINR(calculatedCost.ceilingPainting)}</span>
                    </div>
                    <div className="breakdown-row">
                      <span>White-Glove Installation & 10-Yr Warranty</span>
                      <span>{formatINR(calculatedCost.installation)}</span>
                    </div>
                  </div>
                </div>

                <div>
                  <button className="btn btn-gold" style={{ width: '100%', padding: '1rem' }} onClick={handleBook}>
                    Lock This Estimate & Get 3D Drawings
                  </button>
                  <div style={{ textAlign: 'center', marginTop: '0.8rem', fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                    ✓ 0 Token Advance • Free Site Visit Across Hyderabad
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

                      Selected Estimate ({initialData.propertyType} - {initialData.packageTier}):
                    </span>
                    <span style={{ color: 'var(--gold-dark)', fontWeight: '800', fontSize: '1.1rem' }}>
                      {initialData.estimatedAmount}
                    </span>
                  </div>
                )}

                <form onSubmit={handleSubmit}>
                  <div className="form-group">
                    <label className="form-label">Your Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="Enter your name"
                      className="form-input"
                      value={formData.name}
                      onChange={e => setFormData({ ...formData, name: e.target.value })}
                    />
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">WhatsApp / Phone *</label>
                      <input
                        type="tel"
                        required
                        placeholder="+91 98765 43210"
                        className="form-input"
                        value={formData.phone}
                        onChange={e => setFormData({ ...formData, phone: e.target.value })}
                      />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Email ID</label>
                      <input
                        type="email"
                        placeholder="email@domain.com"
                        className="form-input"
                        value={formData.email}
                        onChange={e => setFormData({ ...formData, email: e.target.value })}
                      />
                    </div>
                  </div>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Property Location (Hyderabad)</label>
                      <input
                        type="text"
                        placeholder="e.g. Gachibowli / Moosapet"
                        className="form-input"
                        value={formData.propertyLocation}
                        onChange={e => setFormData({ ...formData, propertyLocation: e.target.value })}
                      />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Home Configuration</label>
                      <select
                        className="form-select"
                        value={formData.configuration}
                        onChange={e => setFormData({ ...formData, configuration: e.target.value })}
                      >
                        <option value="1 BHK">1 BHK</option>
                        <option value="2 BHK">2 BHK</option>
                        <option value="3 BHK">3 BHK</option>
                        <option value="4 BHK / Villa">4 BHK / Villa</option>
                        <option value="Commercial">Commercial Office</option>
                      </select>
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Key Requirements / Notes</label>
                    <textarea
                      rows="2"
                      placeholder="e.g. Modular Kitchen, 2 Wardrobes, False Ceiling"
                      className="form-textarea"
                      value={formData.scopeDetails}
                      onChange={e => setFormData({ ...formData, scopeDetails: e.target.value })}
                    ></textarea>
                  </div>

                  <button type="submit" className="btn btn-gold" style={{ width: '100%', padding: '0.95rem' }}>
                    Confirm Free 3D Design Appointment
                  </button>
                  <div style={{ textAlign: 'center', marginTop: '0.8rem', fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                    ✓ No token advance required • Direct factory engineers
                  </div>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- FLOATING ACTIONS ---
    function FloatingActions() {
      const [showTop, setShowTop] = useState(false);

      useEffect(() => {
        const checkScroll = () => setShowTop(window.scrollY > 400);
        window.addEventListener('scroll', checkScroll);
        return () => window.removeEventListener('scroll', checkScroll);
      }, []);

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
      const whatsappUrl = `https://wa.me/${companyInfo.whatsapp.replace('+', '')}?text=${encodeURIComponent(
        'Hello LS Interiors Hyderabad, I would like to inquire about interior design services and free 3D estimation for my property.'
      )}`;

      return (
        <div className="floating-actions">
          <a href={whatsappUrl} target="_blank" rel="noopener noreferrer" className="float-btn float-whatsapp" title="Chat on WhatsApp">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </a>
          <a href="tel:+919177374198" className="float-btn float-phone" title="Call LS Interiors">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </a>
          {showTop && (
            <button onClick={scrollToTop} className="float-btn float-top" title="Back to Top">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
          )}
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [theme, setTheme] = useState('dark');
      const [estimateModalOpen, setEstimateModalOpen] = useState(false);
      const [modalInitialData, setModalInitialData] = useState(null);
      const [activeSection, setActiveSection] = useState('hero');

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'light' ? 'dark' : 'light');
      };

      const handleOpenEstimate = (customData = null) => {
        setModalInitialData(customData);
        setEstimateModalOpen(true);
      };

      const handleOpenWithService = (serviceTitle) => {
        handleOpenEstimate({
          serviceTitle: `Inquiry for ${serviceTitle}`,
          propertyType: '3 BHK'
        });
      };

      const handleOpenWithCalculatorData = (calcData) => {
        handleOpenEstimate({
          propertyType: calcData.propertyType,
          packageTier: calcData.packageTier,
          estimatedAmount: calcData.estimatedAmount,
          serviceTitle: `Custom package: ${calcData.modulesCount} rooms selected`
        });
      };

      const handleScrollToSection = (sectionId) => {
        setActiveSection(sectionId);
        const element = document.getElementById(sectionId);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <div className="ls-app-root" data-theme={theme}>
          <Navbar
            onOpenEstimate={() => handleOpenEstimate()}
            activeSection={activeSection}
            onNavigate={handleScrollToSection}
            theme={theme}
            toggleTheme={toggleTheme}
          />
          <main>
            <Hero onOpenEstimate={() => handleOpenEstimate()} onScrollToSection={handleScrollToSection} />
            <Stats />
            <WhyChooseUs onOpenEstimate={() => handleOpenEstimate()} />
            <BeforeAfterSlider onOpenEstimate={() => handleOpenEstimate()} />
            <CostCalculator onOpenEstimateWithData={handleOpenWithCalculatorData} />
            <ServicesSection onOpenEstimateWithService={handleOpenWithService} />
            <FactoryInterio onOpenEstimate={() => handleOpenEstimate()} />
            <GallerySection onOpenEstimate={() => handleOpenEstimate()} />
            <CorporateClients />
            <Testimonials onOpenEstimate={() => handleOpenEstimate()} />
            <ContactSection />
          </main>
          <Footer onScrollToSection={handleScrollToSection} onOpenEstimate={() => handleOpenEstimate()} />
          <FloatingActions />
          <EstimateModal
            isOpen={estimateModalOpen}
            onClose={() => setEstimateModalOpen(false)}
            initialData={modalInitialData}
          />
        </div>
      );
    }

    // Render to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
